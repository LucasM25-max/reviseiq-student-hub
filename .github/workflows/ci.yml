name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values. Nothing here reaches a real service; the database is the
  # ephemeral service container below.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reviseiq
  AUTH_SECRET: ci-secret-that-is-comfortably-over-thirty-two-characters
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviseiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, so the client exists from here on.
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed the curriculum taxonomy
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and database tests
        run: npm test

      - name: Build
        run: npm run build

      # Proves Phase 2's exit criterion against a running server: a new account can
      # complete onboarding and land on Today, with JavaScript disabled.
      - name: Smoke test the running app
        run: |
          npm run start -- --port 3000 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke

      - name: Audit production dependencies
        run: npm run audit:prod
