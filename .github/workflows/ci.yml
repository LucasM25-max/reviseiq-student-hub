name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values. Nothing here reaches a real service; the database is the
  # ephemeral service container below.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reviseiq
  AUTH_SECRET: ci-secret-that-is-comfortably-over-thirty-two-characters
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviseiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, so the client exists from here on.
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed the curriculum taxonomy
        run: npm run db:seed

      # Fast, database-free gate: schemas, cross-references and coverage. Runs before
      # the slower steps so a broken content file fails in seconds rather than minutes.
      - name: Validate content
        run: npm run content:validate

      - name: Seed content into Postgres
        run: npm run content:seed

      # /content is the source of truth and Postgres is a rebuildable query layer, so
      # seeding twice must be a no-op. If the second run reports stale rows removed or
      # differing counts, the seeder is not idempotent and a deploy would churn content.
      - name: Prove the content seed is idempotent
        run: |
          npm run content:seed > /tmp/seed-1.txt
          npm run content:seed > /tmp/seed-2.txt
          diff <(grep '^\[content:seed\]' /tmp/seed-1.txt) \
               <(grep '^\[content:seed\]' /tmp/seed-2.txt)
          if grep -q 'stale row' /tmp/seed-2.txt; then
            echo "Second seed removed rows — the seeder is not idempotent." >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and database tests
        run: npm test

      - name: Build
        run: npm run build

      # Proves Phase 2's exit criterion against a running server: a new account can
      # complete onboarding and land on Today, with JavaScript disabled.
      - name: Smoke test the running app
        run: |
          npm run start -- --port 3000 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke

      - name: Audit production dependencies
        run: npm run audit:prod

      # Phase 3 exit criterion, stated plainly as its own step so it is visible in the
      # CI log rather than buried in the test run: deliberately broken content must fail.
      # The fixtures live in tests/fixtures/broken-content/ and are broken on purpose.
      - name: Prove broken content is rejected
        run: |
          for fixture in schema references gates; do
            if npx tsx tests/fixtures/broken-content/validate-entry.ts "$fixture" \
                 > /dev/null 2>&1; then
              echo "Broken content fixture '$fixture' was accepted by the validator." >&2
              exit 1
            fi
            echo "✓ '$fixture' fixture correctly rejected"
          done
